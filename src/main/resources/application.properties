spring.application.name=medibook
server.port=${MEDIBOOK_PORT:8081}

# ---------- Database (MySQL) ----------
# Credentials come from environment variables. Nothing secret lives in source code.
spring.datasource.url=${MEDIBOOK_DB_URL}
spring.datasource.username=${MEDIBOOK_DB_USER}
spring.datasource.password=${MEDIBOOK_DB_PASSWORD}
medibook.jwt.secret=${MEDIBOOK_JWT_SECRET}

# 'update' lets Hibernate create/alter tables on first run. See docs/DATABASE.md for the manual SQL alternative.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- JWT ----------
# REQUIRED: at least 32 characters. Default provided for local development convenience
medibook.jwt.expiration-minutes=${MEDIBOOK_JWT_EXPIRATION_MINUTES:60}

# ---------- CORS ----------
medibook.cors.allowed-origins=${MEDIBOOK_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ---------- Business rules (all configurable) ----------
medibook.timezone=${MEDIBOOK_TIMEZONE:Asia/Kolkata}
medibook.rules.cancellation-min-hours=${MEDIBOOK_CANCEL_MIN_HOURS:2}
medibook.rules.reschedule-min-hours=${MEDIBOOK_RESCHEDULE_MIN_HOURS:4}
medibook.rules.max-reschedules=${MEDIBOOK_MAX_RESCHEDULES:2}
medibook.rules.booking-window-days=${MEDIBOOK_BOOKING_WINDOW_DAYS:60}
medibook.rules.min-lead-minutes=${MEDIBOOK_MIN_LEAD_MINUTES:30}
# true = a doctor may complete a visit any time on/after its date's start (handy for demos).
# Set to false in production so a visit can only be completed after its start time.
medibook.rules.allow-early-completion=${MEDIBOOK_ALLOW_EARLY_COMPLETION:true}

# ---------- Seeding ----------
# Admin is created ONLY when both email and password are supplied. Password is never hard-coded.
medibook.seed.admin-email=${MEDIBOOK_ADMIN_EMAIL:}
medibook.seed.admin-password=${MEDIBOOK_ADMIN_PASSWORD:}
medibook.seed.admin-name=${MEDIBOOK_ADMIN_NAME:System Administrator}
# Demo mode loads clearly labelled SAMPLE doctors + one sample patient. Demo doctors have no fake reviews.
medibook.seed.demo-data=${MEDIBOOK_DEMO_DATA:true}
# If empty, a random demo password is generated and printed once in the console.
medibook.seed.demo-password=${MEDIBOOK_DEMO_PASSWORD:}
logging.level.org.hibernate.SQL=warn

# ---------- Web ----------
# Accept dates as 2026-10-15 and times as 09:30 in query strings.
spring.mvc.format.date=iso
spring.mvc.format.time=iso
spring.mvc.format.date-time=iso
spring.jackson.default-property-inclusion=always
